name: iOS Build

on:
  push:
    branches: ["**"]
    # Versions-Tags (v1.0.21 …) lösen ein Release aus
    tags: ["v*"]
  workflow_dispatch:

env:
  # Jede Workflow-Ausführung bekommt eine eigene, steigende Build-Nummer
  APP_VERSION: 1.0.${{ github.run_number }}
  APP_BUILD: ${{ github.run_number }}

jobs:
  build:
    name: IPA bauen (iPhone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_BUILD=${V##*.}" >> "$GITHUB_ENV"

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: Bauen (ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild \
            -project MP3Player.xcodeproj \
            -scheme MP3Player \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build 2>&1 | tee build.log

      - name: Warnungen prüfen
        run: |
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" build.log | sort -u || true
          if grep -q "nearly matches" build.log; then
            echo "::error::Delegate-Methode passt nicht exakt zur Protokoll-Signatur"
            exit 1
          fi

      - name: Info.plist prüfen (Hintergrund-Audio, Dateifreigabe)
        run: |
          PLIST=build/Build/Products/Release-iphoneos/MP3Player.app/Info.plist
          plutil -p "$PLIST"
          plutil -extract UIBackgroundModes json -o - "$PLIST" | grep -q audio
          plutil -extract UIFileSharingEnabled raw -o - "$PLIST" | grep -q true
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$PLIST")" = "$APP_BUILD"
          # Widget ist eingebettet und hat dieselbe Version wie die App
          WIDGET=build/Build/Products/Release-iphoneos/MP3Player.app/PlugIns/MP3PlayerWidget.appex/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$WIDGET")" = "$APP_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$WIDGET")" = "$APP_BUILD"
          plutil -extract CFBundleURLTypes json -o - "$PLIST" | grep -q ifmusic

      - name: Unsignierte IPA packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MP3Player.app Payload/
          zip -qry MP3Player.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MP3Player-unsigned-ipa
          path: MP3Player.ipa

  test:
    name: Tests im iOS-Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: iPhone-Simulator wählen
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [(rt, d) for rt, lst in devices.items() if ".iOS-" in rt for d in lst if d["name"].startswith("iPhone")]
          found.sort(key=lambda t: [int(x) for x in t[0].split(".iOS-")[1].split("-")])
          rt, d = found[-1]
          print(d["udid"])
          print(rt, d["name"], file=sys.stderr)
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          # Warten, bis der Simulator ganz hochgefahren ist (sonst hängen die ersten Bildschirmfotos)
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Lokalen Testserver für Downloads starten
        run: |
          (cd MP3PlayerTests/Fixtures && nohup python3 -m http.server 8765 > /tmp/testserver.log 2>&1 &)
          # Auf langsamen Maschinen braucht Python etwas, bis der Server lauscht
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://127.0.0.1:8765/tagged.mp3; then echo "Testserver läuft"; exit 0; fi
            sleep 1
          done
          echo "Testserver startet nicht:"; cat /tmp/testserver.log; exit 1

      - name: Unit- und UI-Tests
        run: |
          set -o pipefail
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild \
            -project MP3Player.xcodeproj \
            -scheme MP3Player \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            -resultBundlePath TestResults.xcresult \
            test 2>&1 | tee test.log | grep -E "Test (Case|Suite)|error:|\*\* TEST|Executed" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Screenshots aus dem Testergebnis holen
        if: always()
        run: |
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots/attachments || true
          ls -la screenshots screenshots/attachments || true

      - name: Screenshots als Vorschau ins Log schreiben
        if: always()
        run: |
          for f in screenshots/*.png; do
            [ -f "$f" ] || continue
            sips -Z 640 -s format jpeg -s formatOptions 55 "$f" --out /tmp/preview.jpg >/dev/null
            echo "SCREENSHOT $(basename "$f" .png) $(base64 -i /tmp/preview.jpg | tr -d '\n')"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshots
          path: screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: test.log

  android:
    name: Android-App bauen und im Emulator testen
    # Android ist fertig und pausiert: iPhone-Änderungen sollen kein Android-Update auslösen.
    # Zeile entfernen, sobald es bei Android weitergeht – dann entsteht wieder ein Release mit beiden Apps.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_BUILD=${V##*.}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit-Tests und APK bauen
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest

      - name: Mit neuem Schlüssel signieren (Schlüsselwechsel)
        env:
          NEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_NEW_KEYSTORE_BASE64 }}
          NEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_NEW_KEYSTORE_PASSWORD }}
          NEW_KEY_ALIAS: ${{ secrets.ANDROID_NEW_KEY_ALIAS }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ -z "$NEW_KEYSTORE_BASE64" ]; then
            echo "::warning::Neuer Signier-Schlüssel ist noch nicht als GitHub-Secret hinterlegt – APK bleibt mit dem alten Schlüssel signiert."
            exit 0
          fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$NEW_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/new.p12"
          # Nachweis „alter Schlüssel → neuer Schlüssel“ (Android 9+ akzeptiert dann nur noch den neuen)
          "$BT/apksigner" rotate --out "$RUNNER_TEMP/lineage" \
            --old-signer --ks android/keystore/mp3player-release.jks --ks-key-alias mp3player --ks-pass pass:mp3player-release \
            --new-signer --ks "$RUNNER_TEMP/new.p12" --ks-key-alias "$NEW_KEY_ALIAS" --ks-pass env:NEW_KEYSTORE_PASSWORD
          "$BT/apksigner" sign --out "$RUNNER_TEMP/rotated.apk" --lineage "$RUNNER_TEMP/lineage" --rotation-min-sdk-version 28 \
            --ks android/keystore/mp3player-release.jks --ks-key-alias mp3player --ks-pass pass:mp3player-release \
            --next-signer --ks "$RUNNER_TEMP/new.p12" --ks-key-alias "$NEW_KEY_ALIAS" --ks-pass env:NEW_KEYSTORE_PASSWORD \
            "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/rotated.apk" | grep -E "Verified using|Signer|SHA-256" | head -20
          cp "$RUNNER_TEMP/rotated.apk" "$APK"
          rm -f "$RUNNER_TEMP/new.p12"

      - name: APK bereitstellen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MP3Player.apk
          ls -la MP3Player.apk
          # Für den Update-Test im Emulator über den lokalen Testserver bereitstellen
          cp MP3Player.apk MP3PlayerTests/Fixtures/test-update.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MP3Player-apk
          path: MP3Player.apk

      - name: Lokalen Testserver für Downloads starten
        run: |
          (cd MP3PlayerTests/Fixtures && nohup python3 -m http.server 8765 > /tmp/testserver.log 2>&1 &)
          # Auf langsamen Maschinen braucht Python etwas, bis der Server lauscht
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://127.0.0.1:8765/tagged.mp3; then echo "Testserver läuft"; exit 0; fi
            sleep 1
          done
          echo "Testserver startet nicht:"; cat /tmp/testserver.log; exit 1

      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Geräte-Tests im Android-Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: |
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            gradle --no-daemon connectedDebugAndroidTest > ../android-test.log 2>&1 || touch ../android-test-failed
            adb pull /sdcard/Android/data/com.backewatsch.mp3player/files/screenshots ../android-screenshots || true
            grep -E "Tests on|tests completed|FAILED|AssertionError|Exception" ../android-test.log | head -60 || true
            # Absturzursachen (falls die App abgestürzt ist)
            echo "===== CRASH-LOG ====="
            adb logcat -d -b crash | tail -120 || true
            # Warum Android die App beendet hat (Speicher, Signal, ANR …)
            adb shell dumpsys activity exit-info com.backewatsch.mp3player | head -80 || true
            adb logcat -d | grep -E "com\.backewatsch|lowmemorykiller|lmkd" | grep -iE "kill|died|crash|signal|anr|exception|fatal" | tail -60 || true
            adb logcat -d | grep -E "ExoPlayerImplInternal|PlaybackException|MediaCodec.*(rror|ail)|CCodec.*(rror|ail)" | tail -40 || true
            echo "===== ENDE CRASH-LOG ====="
            test ! -f ../android-test-failed

      - name: Screenshots als Vorschau ins Log schreiben
        if: always()
        run: |
          for f in android-screenshots/*.jpg; do
            [ -f "$f" ] || continue
            echo "SCREENSHOT android-$(basename "$f" .jpg) $(base64 -w0 "$f")"
          done
          tail -80 android-test.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android-test.log
            android-screenshots
            android/app/build/reports

  release:
    name: Release veröffentlichen (für Updates)
    # Wartet nicht auf die iPhone-Tests im Simulator: die dauern lange und sollen keine Version aufhalten
    needs: [build, android]
    # Android aktiv: neues Release mit beiden Apps, sobald beide gebaut und die Android-Tests grün sind.
    # Android pausiert (übersprungen): nur die iPhone-App wird veröffentlicht, ohne neue Versionsnummer für Android.
    if: >-
      always() && github.event_name == 'push' &&
      (github.ref_name == 'main' || github.ref_name == 'claude/beautiful-planck-b2gbcc' || startsWith(github.ref, 'refs/tags/v')) &&
      needs.build.result == 'success' && (needs.android.result == 'success' || needs.android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Versionsnummer aus Tag übernehmen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_BUILD=${V##*.}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: MP3Player-unsigned-ipa

      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: MP3Player-apk

      - name: Nur iPhone – App ans neueste Release hängen (kein Android-Update)
        if: needs.android.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Die Android-App sucht Updates über das „neueste Release“ und dessen Nummer.
          # Deshalb entsteht hier kein neues Release: iPhone-App und AltStore-Quelle werden am neuesten Release ausgetauscht.
          # Die Adresse der Quelle (…/releases/latest/download/altstore-source.json) bleibt dadurch gleich.
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "Neuestes Release: $TAG – iPhone-Version $APP_VERSION wird angehängt"
          python3 scripts/make_altstore_source.py \
            --ipa MP3Player.ipa \
            --version "$APP_VERSION" --build "$APP_BUILD" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --notes "$COMMIT_MESSAGE" \
            --release-tag "$TAG" \
            --out altstore-source.json
          # GitHub lehnt Schreibzugriffe gelegentlich mit HTTP 403 ab – daher mehrere Versuche
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "$TAG" MP3Player.ipa altstore-source.json --clobber --repo "$GITHUB_REPOSITORY"; then
              echo "iPhone-Version $APP_VERSION veröffentlicht (Versuch $attempt)"
              exit 0
            fi
            echo "Versuch $attempt fehlgeschlagen – warte $((attempt * 30)) Sekunden"
            sleep $((attempt * 30))
          done
          exit 1

      - name: AltStore-/SideStore-Quelle erzeugen
        if: needs.android.result == 'success'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/make_altstore_source.py \
            --ipa MP3Player.ipa \
            --version "$APP_VERSION" --build "$APP_BUILD" \
            --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --notes "$COMMIT_MESSAGE" \
            --out altstore-source.json

      - name: GitHub-Release erstellen
        if: needs.android.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Dateien fürs Release: iPhone-App, Android-App und die AltStore-Quelle
          FILES="MP3Player.ipa MP3Player.apk altstore-source.json"
          # Commit-Text ohne Signaturzeilen als Änderungsnotiz
          printf '%s\n' "$COMMIT_MESSAGE" | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md
          [ -s notes.md ] || echo "Neue Version $APP_VERSION" > notes.md
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tag existiert schon (von Hand gesetzt)
            gh release create "$GITHUB_REF_NAME" $FILES \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "ILLEGAL FREEDOM MUSIC $APP_VERSION" --notes-file notes.md --latest
            exit 0
          fi
          # GitHub lehnt das Anlegen gelegentlich mit HTTP 403 ab – daher mehrere Versuche
          for attempt in 1 2 3 4 5 6; do
            if gh release create "v$APP_VERSION" $FILES \
                 --repo "$GITHUB_REPOSITORY" \
                 --target "$GITHUB_SHA" \
                 --title "ILLEGAL FREEDOM MUSIC $APP_VERSION" \
                 --notes-file notes.md \
                 --latest; then
              echo "Release v$APP_VERSION veröffentlicht (Versuch $attempt)"
              exit 0
            fi
            # Halb angelegtes Release wieder entfernen, dann erneut versuchen
            gh release delete "v$APP_VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            echo "Versuch $attempt fehlgeschlagen – warte $((attempt * 30)) Sekunden"
            sleep $((attempt * 30))
          done
          exit 1
